worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml image/svg+xml;

    # Map to preserve www prefix in redirects
    map $host $de_host {
        "~^www\." "www.wieviel.ch";
        default   "wieviel.ch";
    }
    map $host $fr_host {
        "~^www\." "www.calcule.ch";
        default   "calcule.ch";
    }

    # =========================================================
    # Server 1: German (wieviel.ch, www.wieviel.ch, wieviel.treehouse.ch)
    # =========================================================
    server {
        listen 80;
        server_name wieviel.ch www.wieviel.ch wieviel.treehouse.ch;

        root /usr/share/nginx/html;

        # --- Static assets (no language prefix) ---
        location /css/    { try_files $uri =404; }
        location /og/     { try_files $uri =404; }
        location /data/   { try_files $uri =404; }
        location /icons/  { try_files $uri =404; }
        location = /favicon.svg    { try_files $uri =404; }
        location = /manifest.json  { try_files $uri =404; }
        location = /robots.txt     { try_files $uri =404; }
        location = /404.html       { try_files $uri =404; }

        # --- Sitemap: serve German sitemap ---
        location = /sitemap.xml {
            try_files /de/sitemap.xml =404;
        }

        # --- Manifest for French (linked from FR pages) ---
        location = /manifest-fr.json { try_files $uri =404; }

        # --- Cross-domain redirects: French-exclusive paths → calcule.ch ---
        location /alcoolemie       { return 301 https://$fr_host$request_uri; }
        location /salaire          { return 301 https://$fr_host$request_uri; }
        location /pourboire        { return 301 https://$fr_host$request_uri; }
        location /sommeil          { return 301 https://$fr_host$request_uri; }
        location /imc              { return 301 https://$fr_host$request_uri; }
        location /viande           { return 301 https://$fr_host$request_uri; }
        location /amende           { return 301 https://$fr_host$request_uri; }
        location /jours            { return 301 https://$fr_host$request_uri; }
        location /reduction-vacances { return 301 https://$fr_host$request_uri; }
        location /temps-partiel    { return 301 https://$fr_host$request_uri; }
        location /tva              { return 301 https://$fr_host$request_uri; }
        location /loyer            { return 301 https://$fr_host$request_uri; }
        location /hypotheque       { return 301 https://$fr_host$request_uri; }
        location /interets-composes { return 301 https://$fr_host$request_uri; }
        location /randonnee        { return 301 https://$fr_host$request_uri; }
        location /heures           { return 301 https://$fr_host$request_uri; }
        location /conge-parental   { return 301 https://$fr_host$request_uri; }
        location /animal           { return 301 https://$fr_host$request_uri; }
        location /tabac            { return 301 https://$fr_host$request_uri; }
        location /electricite      { return 301 https://$fr_host$request_uri; }

        # --- /fr/* on German domain → redirect to calcule.ch (strip /fr) ---
        location /fr {
            rewrite ^/fr/?(.*)$ https://$fr_host/$1 redirect;
        }

        # --- Legacy redirects: /tool/fr/* → French equivalent on calcule.ch ---
        location ~ ^/promille/fr(/.*)?$         { return 301 https://$fr_host/alcoolemie$1; }
        location ~ ^/lohn/fr(/.*)?$             { return 301 https://$fr_host/salaire$1; }
        location ~ ^/trinkgeld/fr(/.*)?$        { return 301 https://$fr_host/pourboire$1; }
        location ~ ^/schlaf/fr(/.*)?$           { return 301 https://$fr_host/sommeil$1; }
        location ~ ^/bmi/fr(/.*)?$              { return 301 https://$fr_host/imc$1; }
        location ~ ^/fleisch/fr(/.*)?$          { return 301 https://$fr_host/viande$1; }
        location ~ ^/busse/fr(/.*)?$            { return 301 https://$fr_host/amende$1; }
        location ~ ^/tage/fr(/.*)?$             { return 301 https://$fr_host/jours$1; }
        location ~ ^/ferienkuerzung/fr(/.*)?$   { return 301 https://$fr_host/reduction-vacances$1; }
        location ~ ^/teilzeit/fr(/.*)?$         { return 301 https://$fr_host/temps-partiel$1; }
        location ~ ^/mwst/fr(/.*)?$             { return 301 https://$fr_host/tva$1; }
        location ~ ^/miete/fr(/.*)?$            { return 301 https://$fr_host/loyer$1; }
        location ~ ^/hypothek/fr(/.*)?$         { return 301 https://$fr_host/hypotheque$1; }
        location ~ ^/zinseszins/fr(/.*)?$       { return 301 https://$fr_host/interets-composes$1; }
        location ~ ^/wandern/fr(/.*)?$          { return 301 https://$fr_host/randonnee$1; }
        location ~ ^/stunden/fr(/.*)?$          { return 301 https://$fr_host/heures$1; }
        location ~ ^/elternzeit/fr(/.*)?$       { return 301 https://$fr_host/conge-parental$1; }
        location ~ ^/haustier/fr(/.*)?$         { return 301 https://$fr_host/animal$1; }
        location ~ ^/rauchen/fr(/.*)?$          { return 301 https://$fr_host/tabac$1; }
        location ~ ^/strom/fr(/.*)?$            { return 301 https://$fr_host/electricite$1; }
        location ~ ^/iban/fr(/.*)?$             { return 301 https://$fr_host/iban$1; }

        # --- Legacy redirects: /tool/de/* → /tool/* on wieviel.ch ---
        location ~ ^(/promille|/lohn|/trinkgeld|/schlaf|/bmi|/fleisch|/busse|/tage|/ferienkuerzung|/teilzeit|/mwst|/miete|/hypothek|/zinseszins|/wandern|/stunden|/elternzeit|/haustier|/rauchen|/strom|/iban)/de(/.*)?$ {
            return 301 https://$de_host$1$2;
        }

        # --- Default: serve German content ---
        location / {
            try_files /de$uri /de$uri/index.html /de$uri/ =404;
        }
    }

    # =========================================================
    # Server 2: French (calcule.ch, www.calcule.ch, calcule.treehouse.ch)
    # =========================================================
    server {
        listen 80;
        server_name calcule.ch www.calcule.ch calcule.treehouse.ch;

        root /usr/share/nginx/html;

        # --- Static assets (no language prefix) ---
        location /css/    { try_files $uri =404; }
        location /og/     { try_files $uri =404; }
        location /data/   { try_files $uri =404; }
        location /icons/  { try_files $uri =404; }
        location = /favicon.svg       { try_files $uri =404; }
        location = /manifest-fr.json  { try_files $uri =404; }
        location = /manifest.json     { try_files $uri =404; }
        location = /robots.txt        { try_files $uri =404; }
        location = /404.html          { try_files $uri =404; }

        # --- Sitemap: serve French sitemap ---
        location = /sitemap.xml {
            try_files /fr/sitemap.xml =404;
        }

        # --- Cross-domain redirects: German-exclusive paths → wieviel.ch ---
        location /promille         { return 301 https://$de_host$request_uri; }
        location /lohn             { return 301 https://$de_host$request_uri; }
        location /trinkgeld        { return 301 https://$de_host$request_uri; }
        location /schlaf           { return 301 https://$de_host$request_uri; }
        location /bmi              { return 301 https://$de_host$request_uri; }
        location /fleisch          { return 301 https://$de_host$request_uri; }
        location /busse            { return 301 https://$de_host$request_uri; }
        location /tage             { return 301 https://$de_host$request_uri; }
        location /ferienkuerzung   { return 301 https://$de_host$request_uri; }
        location /teilzeit         { return 301 https://$de_host$request_uri; }
        location /mwst             { return 301 https://$de_host$request_uri; }
        location /miete            { return 301 https://$de_host$request_uri; }
        location /hypothek         { return 301 https://$de_host$request_uri; }
        location /zinseszins       { return 301 https://$de_host$request_uri; }
        location /wandern          { return 301 https://$de_host$request_uri; }
        location /stunden          { return 301 https://$de_host$request_uri; }
        location /elternzeit       { return 301 https://$de_host$request_uri; }
        location /haustier         { return 301 https://$de_host$request_uri; }
        location /rauchen          { return 301 https://$de_host$request_uri; }
        location /strom            { return 301 https://$de_host$request_uri; }

        # --- /de/* on French domain → redirect to wieviel.ch (strip /de) ---
        location /de {
            rewrite ^/de/?(.*)$ https://$de_host/$1 redirect;
        }

        # --- Legacy redirects: /tool/de/* → German tool on wieviel.ch ---
        location ~ ^/alcoolemie/de(/.*)?$        { return 301 https://$de_host/promille$1; }
        location ~ ^/salaire/de(/.*)?$           { return 301 https://$de_host/lohn$1; }
        location ~ ^/pourboire/de(/.*)?$         { return 301 https://$de_host/trinkgeld$1; }
        location ~ ^/sommeil/de(/.*)?$           { return 301 https://$de_host/schlaf$1; }
        location ~ ^/imc/de(/.*)?$               { return 301 https://$de_host/bmi$1; }
        location ~ ^/viande/de(/.*)?$            { return 301 https://$de_host/fleisch$1; }
        location ~ ^/amende/de(/.*)?$            { return 301 https://$de_host/busse$1; }
        location ~ ^/jours/de(/.*)?$             { return 301 https://$de_host/tage$1; }
        location ~ ^/reduction-vacances/de(/.*)?$ { return 301 https://$de_host/ferienkuerzung$1; }
        location ~ ^/temps-partiel/de(/.*)?$     { return 301 https://$de_host/teilzeit$1; }
        location ~ ^/tva/de(/.*)?$               { return 301 https://$de_host/mwst$1; }
        location ~ ^/loyer/de(/.*)?$             { return 301 https://$de_host/miete$1; }
        location ~ ^/hypotheque/de(/.*)?$        { return 301 https://$de_host/hypothek$1; }
        location ~ ^/interets-composes/de(/.*)?$ { return 301 https://$de_host/zinseszins$1; }
        location ~ ^/randonnee/de(/.*)?$         { return 301 https://$de_host/wandern$1; }
        location ~ ^/heures/de(/.*)?$            { return 301 https://$de_host/stunden$1; }
        location ~ ^/conge-parental/de(/.*)?$    { return 301 https://$de_host/elternzeit$1; }
        location ~ ^/animal/de(/.*)?$            { return 301 https://$de_host/haustier$1; }
        location ~ ^/tabac/de(/.*)?$             { return 301 https://$de_host/rauchen$1; }
        location ~ ^/electricite/de(/.*)?$       { return 301 https://$de_host/strom$1; }
        location ~ ^/iban/de(/.*)?$              { return 301 https://$de_host/iban$1; }

        # --- Legacy redirects: /tool/fr/* → /tool/* on calcule.ch ---
        location ~ ^(/alcoolemie|/salaire|/pourboire|/sommeil|/imc|/viande|/amende|/jours|/reduction-vacances|/temps-partiel|/tva|/loyer|/hypotheque|/interets-composes|/randonnee|/heures|/conge-parental|/animal|/tabac|/electricite|/iban)/fr(/.*)?$ {
            return 301 https://$fr_host$1$2;
        }

        # --- Default: serve French content ---
        location / {
            try_files /fr$uri /fr$uri/index.html /fr$uri/ =404;
        }
    }

    # =========================================================
    # Server 3: wieviele.ch → redirect to wieviel.ch
    # =========================================================
    server {
        listen 80;
        server_name wieviele.ch www.wieviele.ch;
        return 301 https://wieviel.ch$request_uri;
    }

    # =========================================================
    # Default server: catch-all (e.g., direct IP access)
    # =========================================================
    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;

        location / {
            try_files /de$uri /de$uri/index.html /de$uri/ =404;
        }
    }
}
