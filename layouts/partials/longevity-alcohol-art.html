{{- $id := printf "alcohol-%s" . -}}
<svg viewBox="0 0 160 100" aria-hidden="true" focusable="false">
<defs>
<g id="{{ $id }}-glass"><path d="M-19-31H19V-15C19 3 10 11 0 11S-19 3-19-15Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M0 11V36M-13 36H13" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></g>
<g id="{{ $id }}-wine"><path d="M-17-9H17C16 4 8 9 0 9S-16 4-17-9Z" fill="#bf6d80"/><use href="#{{ $id }}-glass"/></g>
<g id="{{ $id }}-beer"><path d="M18-16H28C41-16 40 17 27 17H18" fill="none" stroke="currentColor" stroke-width="4"/><rect x="-18" y="-29" width="37" height="61" rx="6" fill="#edbd63" stroke="currentColor" stroke-width="2"/><path d="M-16-17H17V-24C17-31 6-35 1-30C-8-36-19-29-16-17Z" fill="#f5ecd6"/><path d="M-8-7V20M3-7V20" stroke="#f7d88a" stroke-width="4" stroke-linecap="round"/></g>
</defs>
{{ if eq . "none" }}<use href="#{{ $id }}-glass" transform="translate(80 47) scale(1.05)"/>
{{ else if eq . "beer" }}<use href="#{{ $id }}-beer" transform="translate(75 47) scale(1.1)"/>
{{ else if eq . "wine" }}<use href="#{{ $id }}-wine" transform="translate(80 47) scale(1.05)"/>
{{ else if eq . "1-14" }}<use href="#{{ $id }}-beer" transform="translate(53 48) scale(.9)"/><use href="#{{ $id }}-wine" transform="translate(111 48) scale(.9)"/>
{{ else if eq . "15-21" }}<use href="#{{ $id }}-wine" transform="translate(35 48) scale(.8)"/><use href="#{{ $id }}-beer" transform="translate(78 48) scale(.8)"/><use href="#{{ $id }}-wine" transform="translate(127 48) scale(.8)"/>
{{ else }}<use href="#{{ $id }}-beer" transform="translate(24 48) scale(.66)"/><use href="#{{ $id }}-wine" transform="translate(64 48) scale(.75)"/><use href="#{{ $id }}-beer" transform="translate(97 48) scale(.66)"/><use href="#{{ $id }}-wine" transform="translate(136 48) scale(.75)"/>
{{ end }}
</svg>
