"longevity.personalMethodTitle": "Comment fonctionne le modèle commun"
"longevity.personalMethod": "Tabagisme, activité, alimentation et alcool modifient ensemble l’intensité annuelle de mortalité avec les coefficients MPoRT de S8 (2016). Le modèle intègre ensuite la courbe de survie et les années restantes. Après un arrêt du tabac, le terme tabagisme diminue avec les années écoulées ; le scénario « j’arrête maintenant » commence aujourd’hui, pas six ans plus tôt. Les questions alimentaires et d’activité sont des approximations simplifiées de l’enquête. L’état civil ne sert qu’à la comparaison officielle. Hormis les années depuis l’arrêt du tabac, les habitudes sont supposées constantes à l’avenir. L’écart lié au mode de vie et sa courbe sont ensuite atténués dès 50 ans par le facteur linéaire historique (80 % à 60 ans, 40 % à 80 ans). Cette hypothèse supplémentaire ne vient pas de MPoRT et n’est pas validée médicalement. La correction Smart BMI est appliquée séparément."
"longevity.personalAdaptations": "La référence utilise les proportions canadiennes publiées par sexe de tabagisme et de forte consommation d’alcool, la médiane d’activité et un score alimentaire approché ; un arrêt de 15 ans est supposé pour les anciens fumeurs. La distribution conjointe manque : la référence est donc construite indépendamment. Sa mortalité annuelle moyenne est ajustée à la table OFS. Cet ancrage mathématique ne constitue pas une validation suisse. L’association favorable observée pour l’alcool ne donne aucun bonus. Smart BMI reste une correction expérimentale propre : 0,4 % des années OFS par point hors de 30–39, au maximum 8 %, sans seconde correction du poids ni atténuation selon l’âge. Les comparaisons individuelles ne s’additionnent pas. La seule question alimentaire porte sur la quantité quotidienne de portions de fruits/légumes ; il n’y a pas d’évaluation personnelle des carottes, pommes de terre ni jus. Les détails supprimés sont approchés par les proportions de référence des tableaux 2/3 au sein du groupe de comparaison. Cela reste une hypothèse simplifiée. Le nombre de portions sert d’approximation des fréquences de consommation de l’étude ; cette conversion n’est pas validée."
"longevity.studyContext": "Source du calcul : MPoRT, S7/S8 et tableaux 2/3. L’étude suisse de Martin-Diener et al. reste une lecture complémentaire, sans coefficients supplémentaires."
