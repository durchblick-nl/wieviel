"longevity.hazardNote": "Les associations observées ne garantissent pas l’effet d’un changement aujourd’hui. Le modèle n’est pas calibré sur la population suisse actuelle. Une faible consommation d’alcool n’est pas présentée comme un avantage pour la santé."
"longevity.studyDetails": "Catégories, combinaison et limites de l’étude"
"longevity.studyMethod": "Nous multiplions les hazard ratios spécifiques au sexe, ajustés conjointement, du tableau 2 de Martin-Diener et al. (2014). Les enquêtes datent de 1977–1993, avec suivi jusqu’en 2008. Le modèle distingue les fumeurs actuels des non-fumeurs, sans durée ni quantité de tabagisme. Les fruits consommés la veille sont un indicateur alimentaire sommaire. Les intervalles individuels ne permettent pas de calculer un intervalle conjoint sans données supplémentaires du modèle."
"longevity.alcoholMethod": "L’alcool était relevé uniquement pour la veille. NRP 1A définissait la catégorie intermédiaire par moins de 20 g/jour pour les femmes et moins de 40 g pour les hommes, la catégorie élevée au-delà. MONICA distinguait un type de boisson (vin, bière ou cidre) des spiritueux ou de plusieurs types de boissons. Ces catégories ne correspondent pas aux recommandations actuelles."
