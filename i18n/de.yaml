"longevity.personalMethodTitle": "Modellregeln und Unterschiede zum alten Rechner"
"longevity.personalMethod": "Ausgangspunkt ist die verbleibende Lebenserwartung aus der BFS-Tabelle 2025. Historische Rohwerte: nie geraucht +2; seit mehr als fünf Jahren aufgehört +1; pro täglicher Zigarette −0,2. Bewegung: nie −2, selten −1, unter einmal pro Woche 0, ein- bis zweimal +1, häufiger +2. Täglich Obst/Gemüse +1, sonst 0. Alkohol: bis drei Portionen 0, vier −1, sechs −3, acht −5, ab zehn −7. Beim BMI: 20–25 +1, unter 20 oder über 25 bis 30 −1, über 30 bis 40 −2. Zivilstand: alters-, geschlechts- und grundwertabhängige Formel aus dem historischen Rechner. Ab 50 werden alle Korrekturen mit (100 − Alter) / 50 abgeschwächt."
"longevity.personalAdaptations": "Wir übernehmen die Kombinationsidee, nicht alle alten Regeln: kein Alkoholbonus, kein zusätzlicher Abschlag für verheiratete Frauen, kein Sprung zwischen BMI 20,0 und 20,1. Unbekannte Angaben zählen nicht als günstige Antworten. Der Bonus ist auf zwölf Jahre begrenzt; die Restzeit fällt nicht unter ein Viertel des Grundwerts. Diese Grenzen sind historische Modellannahmen. Ein alter Rechenwert wird durch neue Basisdaten nicht wissenschaftlich validiert."
"longevity.studyContext": "Studien helfen, die Zusammenhänge einzuordnen. Die folgende Schweizer Studie untersucht mehrere Lebensstilfaktoren gemeinsam; ihre Hazard Ratios werden nicht als Jahresgewichte der persönlichen Schätzung verwendet."
