"longevity.personalNote": "Eine sehr grobe, nicht validierte Modellschätzung. Aktuelle Schweizer Basiswerte werden mit angepassten Regeln des alten Rechners kombiniert. Die Nachkommastelle macht Änderungen sichtbar und steht nicht für persönliche Vorhersagegenauigkeit."
