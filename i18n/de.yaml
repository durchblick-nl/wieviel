"longevity.maritalReference": "Beispiel Männer: 20,8 Restlebensjahre bei Verheirateten gegenüber 16,4 bei Ledigen und 19,8 insgesamt. Das sind 4,4 Jahre Unterschied gegenüber Ledigen, aber 1,0 Jahr gegenüber der Gesamtbevölkerung."
"longevity.maritalNote": "Ledig bedeutet nicht automatisch alleinlebend. Gesundheit, Lebensstil, Ressourcen und soziale Unterstützung können mit dem Zivilstand zusammenhängen. Die Gruppenwerte belegen keinen persönlichen Gewinn durch eine Heirat."
