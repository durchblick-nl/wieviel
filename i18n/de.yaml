"longevity.ratioDescription": "Verglichen mit dem Referenzprofil im historischen Studienmodell. Gemeint ist das Verhältnis momentaner Sterberaten (Hazard Ratio), keine absolute Todeswahrscheinlichkeit."
"longevity.reference": "Referenz: aktuell nicht rauchend, höhere Freizeitaktivität, Obst am Vortag und kein Alkohol am Vortag."
"longevity.hazardNote": "Zusammenhänge aus Beobachtungsdaten sind keine Garantie für den Nutzen einer Änderung heute. Das Modell ist nicht auf die heutige Schweizer Bevölkerung kalibriert. Ein geringer Alkoholkonsum wird hier nicht als Gesundheitsbonus dargestellt."
"longevity.studyDetails": "Studienkategorien, Kombination und Grenzen"
"longevity.studyMethod": "Wir multiplizieren die geschlechtsspezifischen, gemeinsam adjustierten Hazard Ratios aus Tabelle 2 von Martin-Diener et al. (2014). Grundlage sind Erhebungen von 1977–1993 mit Nachbeobachtung bis 2008. Das Modell unterscheidet aktuelle Raucher und Nichtraucher, nicht Dauer oder Menge des Rauchens. Obst am Vortag ist ein grober Ernährungsindikator. Aus den einzelnen Unsicherheitsintervallen lässt sich ohne weitere Modelldaten kein gemeinsames Intervall berechnen."
"longevity.alcoholMethod": "Alkohol wurde nur für den Vortag erfasst. NRP 1A verwendete für die mittlere Kategorie unter 20 g/Tag bei Frauen bzw. unter 40 g bei Männern; die hohe Kategorie lag darüber. MONICA unterschied eine Getränkeart (Wein, Bier oder Most) von Spirituosen oder mehreren Getränkearten. Diese Kategorien sind nicht mit heutigen Empfehlungen gleichzusetzen."
"longevity.studySource": "Originalstudie und Tabelle 2"
"longevity.maritalTitle": "Leben Verheiratete länger?"
"longevity.maritalIntro": "Die Schweizer Zahlen zeigen Unterschiede zwischen Gruppen. Hier kannst du sie direkt vergleichen – ohne einen pauschalen Ehe-Bonus auf deine Berechnung aufzuschlagen."
"longevity.maritalContext": "Dieser Vergleich gilt für Menschen, die 65 bereits erreicht haben, und verwendet die BFS-Periode 2018–2023. Er wird nicht auf dein gewähltes Alter oder das Datenjahr 2025 übertragen."
"longevity.maritalAt65": "Dein gewähltes Alter passt zu diesem Vergleich. Beachte den anderen Datenzeitraum: 2018–2023 statt 2025."
